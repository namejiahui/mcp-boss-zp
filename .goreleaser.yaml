# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: mcp-boss-zp

before:
  hooks:
    - go mod tidy

builds:
  - id: mcp-boss-zp
    main: ./cmd/mcp-boss-zp
    binary: mcp-boss-zp
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X 'main.Version={{ .Version }}'

archives:
  - id: default
    format: binary
    name_template: "{{ .Binary }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

